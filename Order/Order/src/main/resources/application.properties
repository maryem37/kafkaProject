spring.application.name=Order

server.port=8082
inventory.service.url=http://localhost:8080/api/v1/inventory

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/ticketing?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

#kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=order-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.type.mapping=bookingEvent:tn.orderService.Order.event.BookingEvent