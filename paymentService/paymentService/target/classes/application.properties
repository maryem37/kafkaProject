spring.application.name=paymentService
server.port=8083

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/ticketing?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema migrations are owned by the inventory service (single Flyway owner)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

# Customer service (bookingService) base URL, used to look up user email
customer.service.base-url=http://localhost:8081/api/v1

# Email notifications (Mailtrap SMTP)
# Set payment.email.enabled=true and provide MAILTRAP_USERNAME / MAILTRAP_PASSWORD
payment.email.enabled=true
payment.email.from=no-reply@eventflow.local
payment.email.fallback-to=

# Configuration du serveur SMTP
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=04a561b173f0af
spring.mail.password=48066646924aed

# Authentification et s�curit�
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Optionnel : debug pour voir les logs des emails
spring.mail.properties.mail.debug=true

# kafka
spring.kafka.bootstrap-servers=localhost:9092

# producer (publish payment completed events)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# consumer (consume order created events)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
